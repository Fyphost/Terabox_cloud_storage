# Fyphost — production Nginx config
#
# Goals:
#   - Terminate TLS for the public hostname.
#   - Forward /api/v1/* to the Fastify API (PM2 cluster on 4000).
#   - Forward everything else to the Next.js web (PM2 fork on 3000).
#   - Pass HTTP Range headers untouched and disable response buffering on
#     stream routes so HLS playback isn't held up by the proxy.
#   - Set sane timeouts for long-tail downloads.
#
# Replace fyphost.app with your domain.  Use certbot or your TLS automation
# of choice to populate the certificate paths.

upstream fyphost_api {
    server 127.0.0.1:4000;
    keepalive 64;
}

upstream fyphost_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Permissive CORS for HLS segments — signed URLs are the actual auth.
map $request_uri $stream_route {
    default 0;
    "~^/api/v1/(stream/|media/[^/]+/master\\.m3u8)" 1;
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name fyphost.app www.fyphost.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fyphost.app;

    ssl_certificate     /etc/letsencrypt/live/fyphost.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fyphost.app/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Hardening
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Generous body sizes only for ingest; streaming routes don't read bodies.
    client_max_body_size 4m;

    # Long timeouts for ranged downloads and saved-media transfer.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    keepalive_timeout   75s;

    # Real-IP / X-Forwarded-* propagation.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # ── API ──────────────────────────────────────────────────────────────
    location /api/v1/ {
        proxy_pass         http://fyphost_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        # Pass Range/If-Range untouched.
        proxy_set_header Range          $http_range;
        proxy_set_header If-Range       $http_if_range;
        proxy_set_header If-Modified-Since $http_if_modified_since;

        # On streaming routes only: disable buffering so HLS segments and
        # long byte-range transfers stream byte-for-byte to the client.
        proxy_buffering            off;
        proxy_request_buffering    off;
        proxy_max_temp_file_size   0;

        # Pass through Range responses cleanly.
        proxy_force_ranges on;

        # Permissive CORS for HLS resources (the signed URL is the auth).
        if ($stream_route = 1) {
            add_header Access-Control-Allow-Origin  "*"        always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Content-Type"  always;
            add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length, Content-Disposition, Content-Type" always;
        }
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Range, Content-Type";
            add_header Access-Control-Max-Age       86400;
            add_header Content-Length               0;
            add_header Content-Type                 "text/plain";
            return 204;
        }
    }

    # ── Web (Next.js) ───────────────────────────────────────────────────
    location / {
        proxy_pass         http://fyphost_web;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_buffering    on;
    }

    # ── Next static assets ──────────────────────────────────────────────
    location /_next/static/ {
        proxy_pass        http://fyphost_web;
        proxy_cache_valid 200 1h;
        add_header        Cache-Control "public, max-age=31536000, immutable";
    }
}
